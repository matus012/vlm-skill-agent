walls:  # segments x1 y1 x2 y2
  - [-5.0, -4.0, 5.0, -4.0]
  - [5.0, -4.0, 5.0, 4.0]
  - [5.0, 4.0, -5.0, 4.0]
  - [-5.0, 4.0, -5.0, -4.0]
objects:
