  - {name: green_shelf, shape: box, pos: [0.0, 3.5, 0.9], size: [0.8, 0.3, 0.9], rgba: [0.2, 0.6, 0.25, 1]}
  - {name: blue_barrel, shape: cylinder, pos: [-4.2, 0.0, 0.5], size: [0.4, 0.5], rgba: [0.15, 0.3, 0.8, 1]}
  - {name: yellow_bed, shape: box, pos: [0.0, -3.3, 0.35], size: [1.0, 0.5, 0.35], rgba: [0.9, 0.8, 0.2, 1]}
lights:
