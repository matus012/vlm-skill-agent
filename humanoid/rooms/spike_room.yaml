# Side-H spike room: closed 10 x 8 m box, ceiling, four large objects away from the H1 waypoint loop.
# Coordinates: world frame, metres, origin at the room centre, z up. Sizes are MuJoCo half-extents
# (box: hx hy hz; cylinder: radius, half-height).
name: spike_room
floor: {size: [10.0, 8.0], rgba: [0.55, 0.50, 0.45, 1]}
wall_height: 2.6
wall_thickness: 0.12
wall_rgba: [0.85, 0.85, 0.80, 1]
ceiling: true
