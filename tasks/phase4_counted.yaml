# Task 007 counted set: 40 runs = 10 per type (check_state, count, conditional, find), each used once, written and
# committed before any 007 VLM result existed. Entry {run_id, task_id, start_place, seed} as 005, plus `world:
# cabinet_open` on open-variant entries (absent = closed). True answers are never written here: agent/truth.py
# derives them from the entry's world truth.json. Checked by tests/test_phase4_lists.py; gates: probes/phase4_gates.py.
# Selection rule (2026-11-05, by rule, no VLM output seen):
# - "Answer room" per type: check_state = the cabinet's room (storage); count = the counted room; conditional = the
#   room the true answer names; find = the target's room. At most 2 of 10 runs per type start there.
# - check_state: "Is the storage cabinet open?" 6 runs, "... closed?" 4; worlds closed 5 / cabinet_open 5; true
#   answers yes 5 / no 5 (open? x closed = no 3, open? x open = yes 3, closed? x closed = yes 2, closed? x open = no 2).
#   Starts hall 3, ward 2, office 2, reception 2, storage 1.
# - count: chairs-in-reception 5, beds-in-ward 5; each prompt starts once from the hall and once from each room
#   (answer-room starts: 1 + 1).
# - conditional: both branches 5 / 5. First room right (target in if_not_in): cond-toolbox 3 (-> storage),
#   cond-chairs-reception 2 (-> reception). First room wrong: cond-toolbox-office 2 (-> storage), cond-beds-ward 3
#   (-> ward). Every prompt once from the hall, the rest from the room the prompt names first (office) or another
#   non-answer room; one answer-room start (chairs from reception).
# - find: 005's four Find prompts (regression guard), 005's split (toolbox 2, cabinet 2, beds 3, chairs 3); each once
#   from the hall, beds and chairs once from their own room (2 answer-room starts), the rest from other rooms.
# - Order: type blocks in the order above (the cross-job split assigns entries in list order, hpc/PERUN_SIM.md s5).
# - seed = random.Random("115-007-counted").sample(range(1, 2**31 - 1), 40), in run order; disjoint from every seed in
#   tasks/phase3_*.yaml and tasks/phase4_dev.yaml. Dev blocks use tasks/phase4_dev.yaml and never these run ids.
